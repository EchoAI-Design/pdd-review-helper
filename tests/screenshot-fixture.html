<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>截图文案回归 · 模拟评价页</title>
<style>body{font:14px sans-serif;color:#333;margin:25px}#shop{position:absolute;right:25px;top:20px}main{margin-top:60px}.filters{display:flex;gap:18px;margin:18px 0}button{color:#333;background:white;border:1px solid #ccc;padding:7px;cursor:pointer}.selected{color:#146ae0;background:#edf5ff}table{width:100%;margin:18px 0;border-collapse:collapse}td{border:1px solid #ddd;padding:15px}.pagination{display:flex;gap:18px}svg{width:12px;height:12px}.disabled{opacity:.3}</style>
<span id="shop">模拟运动店铺</span><main><div class="filters" id="days"><button>近30天</button><button class="selected">近90天</button><button>近180天</button></div>
<div class="filters" id="stars"><span>用户评价得分</span><button>1星</button><button>2星</button><button>3星</button><button>4星</button><button>5星</button></div>
<div class="filters" id="contents" data-multiple="1"><button>有图片</button><button>有视频</button><button>主评有文字</button><button>有追加评价</button><button>已举报</button></div>
<div class="filters" id="tags"><button>质量好(17)</button><button>质量差(12)</button></div><div class="filters" id="replies"><button>已回复</button><button>未回复</button></div><div class="filters" id="reward"><button>评价有礼</button></div>
<div><label><span>订单编号</span><input id="order-input"></label><label><span>商品ID</span><input id="product-input"></label><label><span>关键词</span><input id="keyword-input"></label></div>
<button id="reset">重置</button><button id="query">查询</button><div id="result"></div></main>
<script>
window.actions=[];window.reportedOrders=new Set();window.queryDelay=30;window.mode='normal';let currentStar=1,currentPage=1;
document.querySelectorAll('.filters').forEach(group=>group.addEventListener('click',e=>{if(e.target.tagName!=='BUTTON')return;if(group.dataset.multiple){e.target.classList.toggle('selected');return}group.querySelectorAll('button').forEach(b=>b.classList.remove('selected'));e.target.classList.add('selected')}));
document.querySelector('#reset').onclick=()=>{actions.push('reset');document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('selected'));document.querySelectorAll('#days button')[1].classList.add('selected');document.querySelectorAll('main input').forEach(i=>i.value='')};
document.querySelector('#query').onclick=()=>{currentStar=Number(document.querySelector('#stars .selected')?.textContent[0]||1);actions.push('query-'+currentStar);window.lastQuery={date:document.querySelector('#days .selected')?.textContent,content:[...document.querySelectorAll('#contents .selected')].map(el=>el.textContent),reply:document.querySelector('#replies .selected')?.textContent,tag:document.querySelector('#tags .selected')?.textContent,reward:!!document.querySelector('#reward .selected'),order:document.querySelector('#order-input').value,product:document.querySelector('#product-input').value,keyword:document.querySelector('#keyword-input').value};currentPage=1;load()};
const sizes={1:63,2:25,3:12};
function load(){document.querySelector('#result').innerHTML='<div aria-busy="true">加载中</div>';setTimeout(render,queryDelay)}
function render(){const all=Array.from({length:sizes[currentStar]||0},(_,n)=>n+1).filter(n=>(!window.lastQuery?.order||lastQuery.order===`260909-${currentStar}000${n}`)&&(!window.lastQuery?.product||lastQuery.product==='900123'));const total=all.length,start=(currentPage-1)*10,rows=all.slice(start,start+10);
document.querySelector('#result').innerHTML=`<p>共查询到 <span>${total}</span> 条数据（未包含默认评价）</p>`+(total?rows.map(n=>`<table><tr><td colspan="4"><span>用户评分：</span><span>${Array.from({length:currentStar},()=>'<svg viewBox="0 0 20 20"><path style="fill:rgb(255,77,79)" d="M10 1 13 7 19 7 14 12 16 19 10 15 4 19 6 12 1 7 7 7Z"/></svg>').join('')}</span><span>被点赞数：0　互动数：0</span></td></tr><tr><td>${n%3===0?'该用户未填写文字评价':'模拟评价内容 '+currentStar+'-'+n}<div>2026-09-09 12:30:00</div></td><td>订单编号：260909-${currentStar}000${n}<div>商品ID: 900123</div></td><td>评价标签</td><td><a>查看订单</a><button class="report-action" data-mock-key="${currentStar}-${n}">${n%4===0||reportedOrders.has(currentStar+'-'+n)?'已举报':'举报'}</button><a>回复/互动</a></td></tr></table>`).join(''):'<div>暂无数据</div>')+`<div class="pagination"><div class="page-size">10条/页</div><ul class="page-controls">${Array.from({length:Math.max(1,Math.ceil(total/10))},(_,i)=>`<li data-page="${i+1}" class="${currentPage===i+1?'page-selected':''}"><span>${i+1}</span></li>`).join('')}<li class="page-jump-next">···</li><li class="page-next ${currentPage*10>=total?'disabled':''}" ${mode==='ambiguousNext'?'':'aria-label="下一页"'}>下一页</li></ul><span>共${Math.ceil(total/10)}页</span></div>`;
document.querySelector('.page-next').onclick=()=>{if(currentPage*10>=total)return;actions.push('next-'+currentStar);currentPage++;load()};document.querySelector('.page-jump-next').onclick=()=>{actions.push('JUMP');currentPage=Math.ceil(total/10);load()};document.querySelectorAll('[data-page]').forEach(el=>el.onclick=()=>{const next=Number(el.dataset.page);actions.push(next===currentPage+1?'next-'+currentStar:'goto-'+next);currentPage=next;load()});document.querySelectorAll('.report-action').forEach(b=>b.onclick=()=>{actions.push('REPORT_CLICK');openReport(b)});}
function openReport(button){if(!window.allowReports)throw Error('不得点击举报');const m=document.createElement('div');m.setAttribute('role','dialog');m.style.cssText='position:fixed;right:20px;top:20px;background:white;border:1px solid #aaa;padding:20px;z-index:100';m.innerHTML='<h2>评价举报</h2><p>举报类型</p>'+['评价内容异常','星级与内容矛盾','利用评价要挟','同行恶意差评'].map(x=>`<label><input type="radio" name="reason" ${x===window.disabledReason||window.disabledReportKeys?.has(button?.dataset.mockKey)?'disabled':''}><span>${x}</span></label>`).join('')+'<p>详细描述</p><textarea></textarea><button class="submit">提交举报</button><button class="cancel">取消</button>';m.querySelector('.submit').onclick=()=>{actions.push('SUBMIT');if(window.confirmMockReports){reportedOrders.add(button.dataset.mockKey);button.textContent='已举报';m.remove()}};m.querySelector('.cancel').onclick=()=>{actions.push('CANCEL');m.remove()};document.body.append(m)}
render();
</script></html>
